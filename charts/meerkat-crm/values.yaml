# Default values for meerkat-crm.
replicaCount: 1

image:
  repository: ghcr.io/fbuchner/meerkat-crm
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# NOTE: The entrypoint runs usermod/groupmod for PUID/PGID remapping and then
# supervisord drops the backend to appuser. The container therefore needs to
# start as root; set runAsNonRoot only if you disable PUID remapping.
podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - chart-example.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3



# Persistent storage for CRM data and photos
persistence:
  # Enable persistence using PVC
  enabled: true
  # Storage class to use for the PVC
  # Use "-" for default storage class
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  # Size of the persistent volume
  size: 5Gi
  mountPath: /app/data

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# Application environment variables
# For all available configuration options, see: 
# https://github.com/fbuchner/meerkat-crm/blob/main/.env.example
env:
  - name: JWT_SECRET_KEY
    value: "change-me-in-production-minimum-32-characters"
  - name: FRONTEND_URL
    value: "*"
  - name: CARDDAV_ENABLED
    value: "true"
  - name: PUID
    value: "1001"

# Environment variables from secrets or configmaps
envFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-configmap
